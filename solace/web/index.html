<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solace</title>
<style>
  :root {
    --bg: #f6f4ef; --surface: #ffffff; --text: #22252a; --muted: #6b6f76;
    --accent: #3f6f68; --user: #e3ece9; --border: #e2ded6; --alert: #8a3b2e; --alert-bg: #fbeeea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181b; --surface: #1f2226; --text: #e8e6e1; --muted: #9a9ea5;
      --accent: #7fb3aa; --user: #2a3634; --border: #2e3237; --alert: #f2a594; --alert-bg: #3a2420;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .app { max-width: 720px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; padding: 0 16px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--border); }
  h1 { font-size: 1.25rem; margin: 0; color: var(--accent); letter-spacing: .02em; }
  select { font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
  .notice { font-size: .85rem; color: var(--muted); padding: 10px 0; }
  #log { flex: 1; overflow-y: auto; padding: 8px 0 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; }
  .bot { background: var(--surface); border: 1px solid var(--border); align-self: flex-start; }
  .me { background: var(--user); align-self: flex-end; }
  .help { background: var(--alert-bg); color: var(--alert); border-radius: 12px; padding: 12px 14px; font-size: .92rem; }
  .help strong { display: block; margin-bottom: 4px; }
  .help ul { margin: 0; padding-left: 18px; }
  form { display: flex; gap: 8px; padding: 12px 0 20px; position: sticky; bottom: 0; background: var(--bg); }
  textarea { flex: 1; font: inherit; resize: none; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--text); min-height: 46px; }
  button { font: inherit; border: 0; border-radius: 12px; padding: 0 18px; background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .typing { color: var(--muted); font-style: italic; }
  .tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .ghost { background: transparent; color: var(--accent); border: 1px solid var(--border); padding: 6px 12px; font-size: .9rem; }
  #mapPanel { display: none; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); margin: 8px 0; overflow: hidden; }
  #mapPanel.open { display: block; }
  #map { height: 320px; }
  .mapinfo { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 8px 12px; font-size: .82rem; color: var(--muted); border-top: 1px solid var(--border); }
  .legend span { display: inline-flex; align-items: center; gap: 4px; margin-right: 10px; }
  .legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .empty { padding: 24px; text-align: center; color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Solace</h1>
    <div class="tools">
    <button class="ghost" id="mapBtn" type="button" aria-expanded="false" aria-controls="mapPanel">My map</button>
    <button class="ghost" id="forgetBtn" type="button">Forget me</button>
    <label>Faith:
      <select id="faith" aria-label="Include faith in the conversation">
        <option value="">None</option>
        <option value="buddhism">Buddhism</option>
        <option value="hinduism">Hinduism</option>
        <option value="islam">Islam</option>
        <option value="christianity">Christianity</option>
      </select>
    </label>
    </div>
  </header>
  <section id="mapPanel" aria-label="Map of what you have shared">
    <div id="map"></div>
    <div class="mapinfo">
      <div class="legend">
        <span><i style="background:#c0634f"></i>issue</span><span><i style="background:#c99a3c"></i>feeling</span>
        <span><i style="background:#8a6fb0"></i>trigger</span><span><i style="background:#5b84b1"></i>person</span>
        <span><i style="background:#4f9a72"></i>support</span><span><i style="background:#3f8f9a"></i>strength</span>
      </div>
      <div id="coverage"></div>
    </div>
  </section>
  <p class="notice">Solace is an AI companion, not a therapist or doctor. If you are in danger, call
    <strong>1926</strong> (Sri Lanka, 24/7) or your local emergency number.</p>
  <div id="log" aria-live="polite">
    <div class="msg bot">Hi, I'm Solace. I'm here to listen. How are you feeling today?</div>
  </div>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Type how you feel…" aria-label="Message" required></textarea>
    <button id="send">Send</button>
  </form>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
<script>
  const COLORS = { issue: "#c0634f", emotion: "#c99a3c", trigger: "#8a6fb0", person: "#5b84b1", support: "#4f9a72", strength: "#3f8f9a" };
  const mapPanel = document.getElementById("mapPanel");
  const mapBtn = document.getElementById("mapBtn");
  let lastGraph = { nodes: [], edges: [], domains: {} };
  let cy = null;

  function drawMap() {
    if (!mapPanel.classList.contains("open")) return;
    const el = document.getElementById("map");
    const g = lastGraph;
    document.getElementById("coverage").textContent =
      `Areas understood: ${Object.keys(g.domains || {}).length} of 11`;
    if (!g.nodes.length) {
      if (cy) { cy.destroy(); cy = null; }
      el.innerHTML = '<div class="empty">Your map will grow as you share. Only you can see it.</div>';
      return;
    }
    if (typeof cytoscape === "undefined") {
      el.innerHTML = '<div class="empty">' + g.nodes.map(n => n.label).join(" · ") + "</div>";
      return;
    }
    el.innerHTML = "";
    const text = getComputedStyle(document.body).getPropertyValue("--text").trim();
    const elements = [
      ...g.nodes.map(n => ({ data: { id: n.id, label: n.label, type: n.type, size: 26 + Math.min(n.mentions, 5) * 6 + n.severity * 6 } })),
      ...g.edges.map(e => ({ data: { id: `${e.source}>${e.target}>${e.relation}`, source: e.source, target: e.target, label: e.relation.replace("_", " ") } })),
    ];
    if (cy) cy.destroy();
    cy = cytoscape({
      container: el, elements, wheelSensitivity: 0.2,
      style: [
        { selector: "node", style: { "background-color": n => COLORS[n.data("type")] || "#888", width: "data(size)", height: "data(size)",
            label: "data(label)", color: text, "font-size": 11, "text-valign": "bottom", "text-margin-y": 4, "text-wrap": "wrap", "text-max-width": 90 } },
        { selector: "edge", style: { width: 1.5, "line-color": "#9aa0a6", "target-arrow-color": "#9aa0a6", "target-arrow-shape": "triangle",
            "curve-style": "bezier", label: "data(label)", "font-size": 9, color: "#9aa0a6", "text-rotation": "autorotate" } },
      ],
      layout: { name: "cose", animate: false, padding: 24, nodeRepulsion: 9000 },
    });
  }

  mapBtn.addEventListener("click", () => {
    const open = mapPanel.classList.toggle("open");
    mapBtn.setAttribute("aria-expanded", open);
    drawMap();
  });

  document.getElementById("forgetBtn").addEventListener("click", async () => {
    if (!confirm("Delete this whole conversation and your map? This cannot be undone.")) return;
    if (sessionId) await fetch(`/api/sessions/${sessionId}`, { method: "DELETE" });
    sessionId = null; shownHelp = false;
    lastGraph = { nodes: [], edges: [], domains: {} };
    log.innerHTML = '<div class="msg bot">Everything has been deleted. I\'m still here if you want to talk.</div>';
    drawMap();
  });

  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  let sessionId = null;
  let shownHelp = false;

  function add(cls, text) {
    const el = document.createElement("div");
    el.className = cls;
    el.textContent = text;
    log.appendChild(el);
    el.scrollIntoView({ behavior: "smooth", block: "end" });
    return el;
  }

  function addHelp(resources) {
    const box = document.createElement("div");
    box.className = "help";
    const title = document.createElement("strong");
    title.textContent = "You don't have to go through this alone. Free, confidential support:";
    const list = document.createElement("ul");
    for (const r of resources) {
      const li = document.createElement("li");
      li.textContent = `${r.name}: ${r.contact}${r.hours ? " (" + r.hours + ")" : ""}`;
      list.appendChild(li);
    }
    box.append(title, list);
    log.appendChild(box);
    box.scrollIntoView({ behavior: "smooth", block: "end" });
  }

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    add("msg me", message);
    input.value = "";
    send.disabled = true;
    const typing = add("msg bot typing", "…");
    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, session_id: sessionId, faith: document.getElementById("faith").value || null }),
      });
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();
      sessionId = data.session_id;
      lastGraph = data.graph;
      drawMap();
      typing.remove();
      add("msg bot", data.reply);
      const crisis = data.risk_level === "high" || data.risk_level === "imminent";
      if (data.resources.length && (crisis || !shownHelp)) { addHelp(data.resources); shownHelp = true; }
    } catch {
      typing.remove();
      add("msg bot", "Sorry, I couldn't connect. If you need urgent help, please call 1926 or your local emergency number.");
    } finally {
      send.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
