name: Safety evaluation

# Runs the live safety evaluation against the real models. Manual, because it costs a little.
# Needs a repository secret named OPENAI_API_KEY.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Which suite to run"
        type: choice
        options: [all, risk, replies]
        default: all

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Run evaluation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: uv run python -m evals ${{ inputs.suite }}
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safety-report
          path: evals/reports/
